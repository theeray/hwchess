name: Verify website
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm --prefix functions ci
      - run: npm test
      - run: npm run build
      - run: npx -y firebase-tools@latest emulators:exec --project demo-headwaters --only auth,firestore,storage,functions 'node --test tests/rules.test.js && node --test functions/integration.test.mjs'
